name: 🚀 Deploy — Sistema POS Personalizado

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CONTEXT.md'

concurrency:
  group: deploy-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📦 Checkout código
        uses: actions/checkout@v4

      - name: 🔑 Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: ✅ Verificar conexión SSH
        run: |
          ssh -o StrictHostKeyChecking=no \
              -p ${{ secrets.VPS_PORT }} \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "echo '✅ SSH OK'"

      - name: 🚢 Deploy en VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
              -p ${{ secrets.VPS_PORT }} \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'REMOTE'
            set -e
            
            echo "📁 Navegando al directorio del proyecto..."
            cd /srv/somosim/pa001/
            
            echo "📥 Pulling últimos cambios..."
            git pull origin main
            
            echo "🐳 Reconstruyendo y levantando servicios..."
            docker compose -f compose.yml up -d --build --remove-orphans
            
            echo "🧹 Limpiando imágenes huérfanas..."
            docker image prune -f
            
            echo "✅ Deploy completado exitosamente"
          REMOTE
