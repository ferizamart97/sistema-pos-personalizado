name: 🚀 CI/CD Pipeline (APA001)

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 🧪 CI - Backend Check (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: 🔍 Validate Composer Config
        run: composer validate

      - name: 📦 Check Dependencies Install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-security-blocking || composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 🔍 PHP Syntax Lint Check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} +
          echo "✅ Todos los archivos PHP tienen sintaxis correcta."

  deploy:
    name: 🚀 Deploy to VPS
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Sync files to VPS via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          SOURCE: "./"
          TARGET: ${{ github.ref_name == 'main' && '/srv/somosim/pa001/apa001' || '/srv/somosim/pa001d/apa001' }}
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: "/.git/, /vendor/, /.env.dev, /.env.prod"

      - name: 🐳 Rebuild & Up Docker Service on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '177.7.36.60' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            if [ "${{ github.ref_name }}" = "main" ]; then
              cd /srv/somosim/pa001
              docker compose up -d --build --force-recreate apa001
            else
              cd /srv/somosim/pa001d
              docker compose up -d --build --force-recreate apa001d
            fi
            echo "✅ Despliegue de APA001 (${{ github.ref_name }}) completado con éxito."
