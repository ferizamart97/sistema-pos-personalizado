# compose.yml — Sistema POS Personalizado — Producción
# Expone subdominios via Traefik:
#   Panel Admin  → pos.somosin.mx / pos.ferizamart97.dev / ppa001.somosim.mx
#   Caja POS     → cpa001.somosim.mx
#   API Backend  → api-pos.somosim.mx / apa001.somosim.mx

name: pa001

services:
  dpa001:
    image: postgres:16-alpine
    container_name: dpa001
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-db_pa001}
      POSTGRES_USER: ${DB_USER:-pos_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pos_prod_secret_2026}
    volumes:
      - dpa001-data:/var/lib/postgresql/data
      - ./apa001/database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./apa001/database/migrations/03_features_update.sql:/docker-entrypoint-initdb.d/03_features.sql:ro
      - ./apa001/database/migrations/04_seed_new_features.sql:/docker-entrypoint-initdb.d/04_seed_features.sql:ro
    networks:
      - pa001-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pos_admin} -d ${DB_NAME:-db_pa001}"]
      interval: 5s
      timeout: 5s
      retries: 5

  apa001:
    build:
      context: ./apa001
      dockerfile: Dockerfile
    container_name: apa001
    restart: unless-stopped
    depends_on:
      dpa001:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DB_HOST=dpa001
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-db_pa001}
      - DB_DATABASE=${DB_NAME:-db_pa001}
      - DB_USER=${DB_USER:-pos_admin}
      - DB_USERNAME=${DB_USER:-pos_admin}
      - DB_PASSWORD=${DB_PASSWORD:-pos_prod_secret_2026}
      - JWT_SECRET=${JWT_SECRET:-secret_jwt_apa001_prod_2026}
      - JWT_EXPIRATION=86400
      - BUSINESS_NAME=${BUSINESS_NAME:-Mi Tienda}
    volumes:
      - uploads-pa001:/var/www/html/public/uploads
    networks:
      pa001-net:
        aliases:
          - apa001
          - apa001d
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pa001-api.rule=Host(`api-pos.somosim.mx`) || Host(`apa001.somosim.mx`)"
      - "traefik.http.routers.pa001-api.entrypoints=websecure"
      - "traefik.http.routers.pa001-api.tls=true"
      - "traefik.http.routers.pa001-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.pa001-api.loadbalancer.server.port=80"

  ppa001:
    build:
      context: ./ppa001
      dockerfile: Dockerfile
    container_name: ppa001
    restart: unless-stopped
    depends_on:
      - apa001
    networks:
      - pa001-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pa001-panel.rule=Host(`pos.somosin.mx`) || Host(`pos.ferizamart97.dev`) || Host(`ppa001.somosim.mx`)"
      - "traefik.http.routers.pa001-panel.entrypoints=websecure"
      - "traefik.http.routers.pa001-panel.tls=true"
      - "traefik.http.routers.pa001-panel.tls.certresolver=letsencrypt"
      - "traefik.http.services.pa001-panel.loadbalancer.server.port=80"

  cpa001:
    build:
      context: ./cpa001
      dockerfile: Dockerfile
    container_name: cpa001
    restart: unless-stopped
    depends_on:
      - apa001
    networks:
      - pa001-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pa001-caja.rule=Host(`cpa001.somosim.mx`)"
      - "traefik.http.routers.pa001-caja.entrypoints=websecure"
      - "traefik.http.routers.pa001-caja.tls=true"
      - "traefik.http.routers.pa001-caja.tls.certresolver=letsencrypt"
      - "traefik.http.services.pa001-caja.loadbalancer.server.port=80"

volumes:
  dpa001-data:
    name: dpa001-data
  uploads-pa001:
    name: uploads-pa001

networks:
  pa001-net:
    name: pa001-net
