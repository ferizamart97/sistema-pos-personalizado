# compose.yml — Sistema POS Personalizado — Producción
# Subdominios configurados en Traefik (ferizamart97.dev):
#   - Panel Admin : https://admin-pos.ferizamart97.dev
#   - Terminal POS: https://pos.ferizamart97.dev
#   - API Backend : https://api-pos.ferizamart97.dev

name: pos-ferizamart

services:

  db:
    image: postgres:16-alpine
    container_name: pos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pos_db}
      POSTGRES_USER: ${DB_USER:-pos_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pos_prod_secret_2026}
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
      - ./apa001/database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./apa001/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./apa001/database/migrations/03_features_update.sql:/docker-entrypoint-initdb.d/03_features.sql:ro
      - ./apa001/database/migrations/04_seed_new_features.sql:/docker-entrypoint-initdb.d/04_seed_features.sql:ro
      - ./apa001/database/migrations/05_massive_test_data.sql:/docker-entrypoint-initdb.d/05_massive_test_data.sql:ro
    networks:
      pos_net:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pos_admin} -d ${DB_NAME:-pos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apa001
      dockerfile: Dockerfile
    container_name: pos_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-pos_db}
      - DB_DATABASE=${DB_NAME:-pos_db}
      - DB_USER=${DB_USER:-pos_admin}
      - DB_USERNAME=${DB_USER:-pos_admin}
      - DB_PASSWORD=${DB_PASSWORD:-pos_prod_secret_2026}
      - JWT_SECRET=${JWT_SECRET:-secret_jwt_pos_prod_2026}
      - JWT_EXPIRATION=86400
      - BUSINESS_NAME=${BUSINESS_NAME:-Mi Tienda}
    volumes:
      - pos_uploads:/var/www/html/public/uploads
    networks:
      pos_net:
        aliases:
          - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pos-api.rule=Host(`api-pos.ferizamart97.dev`)"
      - "traefik.http.routers.pos-api.entrypoints=websecure"
      - "traefik.http.routers.pos-api.tls=true"
      - "traefik.http.routers.pos-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.pos-api.loadbalancer.server.port=80"

  panel:
    build:
      context: ./ppa001
      dockerfile: Dockerfile
    container_name: pos_panel
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - pos_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pos-panel.rule=Host(`admin-pos.ferizamart97.dev`)"
      - "traefik.http.routers.pos-panel.entrypoints=websecure"
      - "traefik.http.routers.pos-panel.tls=true"
      - "traefik.http.routers.pos-panel.tls.certresolver=letsencrypt"
      - "traefik.http.services.pos-panel.loadbalancer.server.port=80"

  caja:
    build:
      context: ./cpa001
      dockerfile: Dockerfile
    container_name: pos_caja
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - pos_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pos-caja.rule=Host(`pos.ferizamart97.dev`)"
      - "traefik.http.routers.pos-caja.entrypoints=websecure"
      - "traefik.http.routers.pos-caja.tls=true"
      - "traefik.http.routers.pos-caja.tls.certresolver=letsencrypt"
      - "traefik.http.services.pos-caja.loadbalancer.server.port=80"

# ============================================================================
# 💾 VOLUMES
# ============================================================================
volumes:
  pos_pgdata:
    name: pos_pgdata
  pos_uploads:
    name: pos_uploads

# ============================================================================
# 🌐 NETWORKS
# ============================================================================
networks:
  pos_net:
    name: pos_net
