name: 🚀 CI/CD Pipeline (CPA001)

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 🧪 CI - Frontend Build (React)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Verify Build
        run: npm run build

  deploy:
    name: 🚀 Deploy to VPS
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Sync files to VPS via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          SOURCE: "./"
          TARGET: ${{ github.ref_name == 'main' && '/srv/somosim/pa001/cpa001' || '/srv/somosim/pa001d/cpa001' }}
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: "/.git/, /node_modules/, /dist/, /.env.dev, /.env.prod"

      - name: 🐳 Rebuild & Up Docker Service on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '177.7.36.60' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            if [ "${{ github.ref_name }}" = "main" ]; then
              cd /srv/somosim/pa001
              docker compose -f compose.prod.yml up -d --no-deps --build --force-recreate cpa001 || docker compose up -d --no-deps --build --force-recreate cpa001
            else
              cd /srv/somosim/pa001d
              docker compose -f compose.dev.yml up -d --no-deps --build --force-recreate cpa001d || docker compose up -d --no-deps --build --force-recreate cpa001d
            fi
            echo "✅ Despliegue de CPA001 (${{ github.ref_name }}) completado con éxito."
